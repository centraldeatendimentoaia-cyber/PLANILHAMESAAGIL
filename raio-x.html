<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Raio-X do Negócio · Sai aê</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,500,0..1,0&display=block">
<style>
:root{
  color-scheme:light;
  --m50:#FFF8E1;--m100:#FFEDB3;--m400:#FFCA33;--m500:#FFC21A;--m600:#E6A800;--m700:#B38300;
  --t0:#FFFFFF;--t50:#F6F5F2;--t100:#ECEAE6;--t200:#D9D7DC;--t300:#B5B3BB;--t400:#8A8893;--t500:#5E5C66;--t600:#45434D;--t700:#2E2C35;--t800:#232229;--t900:#18171C;
  --ok:#1FBF6A;--ok-bg:#E3F7EC;--ok-tx:#0E7A40;--at:#FF8A1C;--er:#F0412F;--er-tx:#B22514;
  --fd:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --fb:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --balao:20px 20px 20px 4px;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--t50);color:var(--t900);font-family:var(--fb);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,p{margin:0}
h1,h2{text-wrap:balance}
button,input{font-family:inherit}
:focus-visible{outline:3px solid var(--m500);outline-offset:2px;border-radius:12px}
[hidden]{display:none!important}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.ms{font-family:'Material Symbols Rounded';font-weight:500;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;overflow:hidden;width:1em;flex:none}
.ms.f{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-inline:20px}

/* topo */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);background:rgba(246,245,242,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-block:14px 12px;z-index:5}
.brandRow{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand svg{height:30px;width:auto}
.qcount{font-size:13px;font-weight:700;color:var(--t500)}
.progressTrack{height:8px;border-radius:999px;background:var(--t100);overflow:hidden}
.progressFill{height:100%;width:0%;border-radius:999px;background:var(--m500);transition:width .45s cubic-bezier(.4,0,.2,1)}

/* passos */
.stage{flex:1;padding-block:24px 40px;display:flex;flex-direction:column}
.step{display:flex;flex-direction:column;gap:18px;animation:rise .38s cubic-bezier(.16,1,.3,1)}
@keyframes rise{from{opacity:.2;transform:translateY(10px)}to{opacity:1;transform:none}}
.backRow{display:flex;align-items:center;margin-bottom:-4px}
.backBtn{display:inline-flex;align-items:center;gap:2px;min-height:44px;border:none;background:none;padding:0 8px 0 0;color:var(--t500);font-size:15px;font-weight:600;cursor:pointer}
.backBtn:hover{color:var(--t900)}
.stepTitle{font-family:var(--fd);font-size:26px;font-weight:800;line-height:1.18;letter-spacing:-.02em}
.stepHint{font-size:16px;color:var(--t500);line-height:1.55}

/* boas-vindas */
.welcomeMark svg{width:72px;height:72px;border-radius:18px;box-shadow:0 12px 24px -12px rgba(24,23,28,.35)}
.welcomeTitle{font-family:var(--fd);font-size:clamp(32px,6vw + 12px,42px);font-weight:800;line-height:1.08;letter-spacing:-.03em}
.welcomeTitle em{font-style:normal;display:inline-block;line-height:1;background:var(--m500);padding:.04em .14em .08em;border-radius:.28em .28em .28em .08em}
.welcomeBody{font-size:17px;color:var(--t600);line-height:1.6}
.miniList{display:flex;flex-direction:column;gap:10px;margin-top:2px}
.miniItem{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--t0);border:1px solid var(--t100);font-size:15px;font-weight:600;color:var(--t700)}
.miniIcon{width:36px;height:36px;border-radius:10px;background:var(--m100);color:var(--t900);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.miniIcon .ms{font-size:20px}

/* opções */
.choiceGrid{display:flex;flex-direction:column;gap:10px}
.chip{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;text-align:left;border:1.5px solid var(--t200);background:var(--t0);border-radius:16px;padding:12px 14px;cursor:pointer;color:var(--t900);transition:border-color .15s,background-color .15s,transform .1s}
.chip:active{transform:scale(.98)}
.chip:hover{border-color:var(--t900)}
.chip.is-selected{border-color:var(--t900);background:var(--m50);box-shadow:inset 0 0 0 1px var(--t900)}
.chipIcon{width:44px;height:44px;border-radius:12px;background:var(--t100);color:var(--t900);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chip.is-selected .chipIcon{background:var(--m500)}
.chipLabel{flex:1;font-size:16px;font-weight:600}
.chipCheck{flex-shrink:0;opacity:0;transition:opacity .15s;color:var(--t900)}
.chip.is-selected .chipCheck{opacity:1}

/* contato */
.field{display:flex;flex-direction:column;gap:6px}
.fieldLabel{font-size:14px;font-weight:700;color:var(--t700)}
.fieldInput{height:52px;border:1.5px solid var(--t200);border-radius:14px;padding:0 14px;font-size:16px;color:var(--t900);background:var(--t0);outline:none;transition:border-color .15s,box-shadow .15s}
.fieldInput::placeholder{color:var(--t400)}
.fieldInput:focus{border-color:var(--t900);box-shadow:0 0 0 3px var(--m200,#FFE080)}
.fieldError{font-size:14px;color:var(--er-tx);font-weight:600;min-height:20px}

/* botões */
.btnPrimary{width:100%;height:56px;border:none;border-radius:999px;background:var(--m500);color:var(--t900);font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background-color .12s,transform .12s,box-shadow .12s}
.btnPrimary:hover{background:var(--m400);box-shadow:inset 0 0 0 1.5px var(--m600)}
.btnPrimary:active{transform:scale(.97)}
.btnPrimary:disabled{opacity:.4;cursor:not-allowed}
.footNote{font-size:13px;color:var(--t500);text-align:center;line-height:1.5}
.bottomBar{position:sticky;bottom:env(safe-area-inset-bottom,0px);background:var(--t50);padding-block:14px 6px;margin-top:auto;display:flex;flex-direction:column;gap:10px}

/* resultado */
.resultHeader{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.resultTag{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--balao);background:var(--t900);color:#fff;font-size:13px;font-weight:700}
.resultTag .ms{color:var(--ok);font-size:18px}
.heroCard{background:var(--t900);border-radius:24px;padding:24px 22px;color:#fff;display:flex;flex-direction:column;gap:6px;box-shadow:0 20px 40px -20px rgba(24,23,28,.5)}
.heroLabel{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t300)}
.heroNumber{font-family:var(--fd);font-size:48px;font-weight:800;line-height:1.05;letter-spacing:-.02em;color:var(--m500)}
.heroSub{font-size:14px;color:var(--t200);line-height:1.5}
.statRow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.statCard{background:var(--t0);border:1px solid var(--t100);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.statLabel{font-size:12px;font-weight:700;color:var(--t500);line-height:1.35}
.statValue{font-family:var(--fd);font-size:18px;font-weight:800;color:var(--t900)}
.statValue.up{color:var(--ok-tx)}
.insightList{display:flex;flex-direction:column;gap:10px}
.insightCard{display:flex;gap:12px;background:var(--t0);border:1px solid var(--t100);border-radius:18px;padding:14px}
.insightIcon{width:36px;height:36px;border-radius:10px;background:var(--m100);color:var(--t900);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.insightIcon .ms{font-size:20px}
.insightText{font-size:15px;color:var(--t700);line-height:1.55}
.ctaCard{background:var(--m500);border-radius:24px;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.ctaTitle{font-family:var(--fd);font-size:20px;font-weight:800;line-height:1.25;color:var(--t900)}
.btnWhats{width:100%;height:56px;border:none;border-radius:999px;background:var(--t900);color:#fff;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .12s,background-color .12s}
.btnWhats:hover{background:var(--t700)}
.btnWhats:active{transform:scale(.97)}
.btnWhats svg{fill:#25D366}
.doneTag{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--balao);background:var(--t900);color:#fff;font-size:13px;font-weight:700}
.doneTag .ms{color:var(--m500);font-size:18px}
.ctaBody{font-size:15px;color:var(--t800);line-height:1.5;margin-top:-6px}
.btnDark,.btnOut{width:100%;height:56px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:700;text-decoration:none;transition:transform .12s,background-color .12s}
.btnDark{background:var(--t900);color:#fff}
.btnDark:hover{background:var(--t700)}
.btnOut{background:transparent;color:var(--t900);box-shadow:inset 0 0 0 1.5px var(--t900)}
.btnOut:hover{background:var(--m400)}
.btnDark:active,.btnOut:active{transform:scale(.97)}
.soonNote{font-size:14px;font-weight:600;color:var(--t900);text-align:center}
.waCard{background:var(--t0);border:1px solid var(--t100);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px}
.waTitle{font-size:15px;font-weight:600;color:var(--t700)}
.sentNote{font-size:14px;color:var(--t900);font-weight:700;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
.copyLink{min-height:44px;text-align:center;font-size:14px;font-weight:600;color:var(--t600);background:none;border:none;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:4px}
.restartLink{min-height:44px;text-align:center;font-size:14px;color:var(--t500);background:none;border:none;cursor:pointer}
.restartLink:hover,.copyLink:hover{color:var(--t900)}
</style>


</head>

<script>
(function(){
  "use strict";

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var WHATSAPP_NUMBER = "5561999531848";
  // Deixe vazio ("") enquanto não existir: o botão mostra "em breve".
  var PLANILHA_URL = "planilha-controle-vendas-sai-ae.xlsx";   // arquivo publicado junto do site
  var CADASTRO_URL = "";   // tela de cadastro do aplicativo
  // Planilha de contatos (Google Apps Script publicado como App da Web). Vazio = não grava.
  var PLANILHA_LEADS_URL = "https://script.google.com/macros/s/AKfycbwSDxwYJfQBynMbM1TD4dTdVXu69NNBJsYf-H4IKYwCyLun98UMptRztwL8PIN4xHnq/exec";
  var PLANILHA_LEADS_TOKEN = "saiae-raiox-2026";

  var ms = function(n, f){ return '<span class="ms' + (f ? ' f' : '') + '" aria-hidden="true">' + n + '</span>'; };
  var ICONS = {
    tent: ms('storefront'), bowl: ms('icecream'), sandwich: ms('lunch_dining'), flags: ms('festival'), dots: ms('more_horiz'),
    check: ms('check_circle', true), clock: ms('schedule'), bulb: ms('lightbulb'), gift: ms('redeem'),
    whats: '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.05-1.33A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.18-1.15l-.3-.18-3.1.82.83-3.02-.2-.31A8.2 8.2 0 1 1 12 20.2zm4.5-6.130c-.24-.12-1.44-.71-1.66-.8-.22-.08-.39-.12-.55.12-.16.24-.63.8-.78.97-.14.16-.28.18-.53.06-.24-.12-1.020-.38-1.94-1.2-.72-.64-1.2-1.43-1.34-1.67-.14-.24-.02-.37.11-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.55-1.33-.76-1.83-.2-.48-.4-.42-.55-.42h-.47c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.7 2.6 4.13 3.65.58.25 1.03.4 1.38.51.58.18 1.11.16 1.53.1.47-.07 1.44-.59 1.640-1.16.2-.57.2-1.06.14-1.16-.06-.1-.22-.16-.46-.28z"/></svg>'
  };

  var LABELS = {
    tipo: { feira:"Barraca de feira", acai:"Açaí / sorveteria", lanchonete:"Lanchonete / quiosque", quermesse:"Barraca de festa / quermesse", outro:"Outro negócio de comida" },
    pedidos: { ate20:"até 20 pedidos", "20a50":"20 a 50 pedidos", "50a100":"50 a 100 pedidos", mais100:"mais de 100 pedidos" },
    ticket: { ate15:"até R$ 15", "15a30":"R$ 15 a R$ 30", "30a50":"R$ 30 a R$ 50", acima50:"acima de R$ 50" },
    anota: { memoria:"de cabeça", papel:"no papel", whats:"num grupo de WhatsApp", planilha:"numa planilha", sistema:"num sistema/app" },
    erros: { quasenunca:"quase nunca", umadois:"1 a 2 vezes por semana", tresacinco:"3 a 5 vezes por semana", todoDia:"praticamente todo dia" },
    fila: { nao:"não, nunca", asvezes:"às vezes", sim:"sim, é comum", naosei:"não sei dizer" }
  };

  var PEDIDOS_MID = { ate20:15, "20a50":35, "50a100":75, mais100:130 };
  var TICKET_MID = { ate15:12, "15a30":22, "30a50":40, acima50:65 };
  var DIAS_MES = { feira:9, acai:26, lanchonete:26, quermesse:4, outro:20 };
  var ERRO_INCIDENTES = { quasenunca:0.5, umadois:1.5, tresacinco:4, todoDia:7 };
  var FILA_FACTOR = { nao:0, asvezes:0.05, sim:0.12, naosei:0.03 };

  var steps = [
    { id:"welcome", type:"welcome" },
    { id:"tipo", type:"choice", title:"Qual desses combina mais com o seu negócio?",
      options:[
        {value:"feira", label:"Barraca de feira", icon:"tent"},
        {value:"acai", label:"Açaí / sorveteria", icon:"bowl"},
        {value:"lanchonete", label:"Lanchonete / quiosque", icon:"sandwich"},
        {value:"quermesse", label:"Barraca de festa / quermesse", icon:"flags"},
        {value:"outro", label:"Outro tipo de comida", icon:"dots"}
      ]},
    { id:"pedidos", type:"choice", title:"Num dia bom, quantos pedidos você atende?",
      options:[
        {value:"ate20", label:"Até 20 pedidos"},
        {value:"20a50", label:"De 20 a 50 pedidos"},
        {value:"50a100", label:"De 50 a 100 pedidos"},
        {value:"mais100", label:"Mais de 100 pedidos"}
      ]},
    { id:"ticket", type:"choice", title:"Qual o valor médio de cada pedido?",
      options:[
        {value:"ate15", label:"Até R$ 15"},
        {value:"15a30", label:"R$ 15 a R$ 30"},
        {value:"30a50", label:"R$ 30 a R$ 50"},
        {value:"acima50", label:"Acima de R$ 50"}
      ]},
    { id:"anota", type:"choice", title:"Hoje, como você anota os pedidos?",
      options:[
        {value:"memoria", label:"De cabeça, na memória"},
        {value:"papel", label:"No papel e caneta"},
        {value:"whats", label:"Num grupo de WhatsApp"},
        {value:"planilha", label:"Numa planilha"},
        {value:"sistema", label:"Já uso algum sistema ou app"}
      ]},
    { id:"erros", type:"choice", title:"Quantas vezes por semana rola confusão, como pedido esquecido, errado ou duplicado?",
      options:[
        {value:"quasenunca", label:"Quase nunca"},
        {value:"umadois", label:"1 a 2 vezes"},
        {value:"tresacinco", label:"3 a 5 vezes"},
        {value:"todoDia", label:"Praticamente todo dia"}
      ]},
    { id:"fila", type:"choice", title:"Você já sentiu que perdeu cliente porque a fila ou o atendimento demorou demais?",
      options:[
        {value:"nao", label:"Não, nunca"},
        {value:"asvezes", label:"Às vezes"},
        {value:"sim", label:"Sim, isso é comum"},
        {value:"naosei", label:"Não sei dizer"}
      ]},
    { id:"contato", type:"contact" },
    { id:"resultado", type:"result" }
  ];

  var answers = { tipo:null, pedidos:null, ticket:null, anota:null, erros:null, fila:null, nome:"", whatsapp:"" };
  var current = 0;

  var stage = document.getElementById("stage");
  var topbar = document.getElementById("topbar");
  var progressFill = document.getElementById("progressFill");
  var qcount = document.getElementById("qcount");

  var QUESTION_STEPS = steps.filter(function(s){ return s.type==="choice" || s.type==="contact"; }).length;

  function questionIndexOf(stepIdx){
    var n = 0;
    for (var i=0;i<stepIdx;i++){
      if (steps[i].type==="choice" || steps[i].type==="contact") n++;
    }
    return n;
  }

  function fmtBRL(v){
    return new Intl.NumberFormat("pt-BR", { style:"currency", currency:"BRL", maximumFractionDigits:0 }).format(Math.max(0, Math.round(v)));
  }

  function computeDiagnosis(a){
    var pedidos = PEDIDOS_MID[a.pedidos];
    var ticket = TICKET_MID[a.ticket];
    var dias = DIAS_MES[a.tipo];
    var faturamentoMensal = pedidos * ticket * dias;
    var perdaErros = ERRO_INCIDENTES[a.erros] * ticket * 4.33;
    var perdaFila = faturamentoMensal * FILA_FACTOR[a.fila];
    var potencial = Math.min(perdaErros + perdaFila, faturamentoMensal * 0.45);
    var novoFaturamento = faturamentoMensal + potencial;

    var insights = [];
    if (a.anota === "memoria" || a.anota === "papel" || a.anota === "whats"){
      insights.push("Anotar " + LABELS.anota[a.anota] + " funciona até certo ponto, mas todo pedido que passa só pela memória (ou por uma mensagem perdida no grupo) é um risco de erro ou esquecimento na correria. O Sai aê registra cada pedido assim que ele entra, e a cozinha nunca fica sem saber o que fazer.");
    } else if (a.anota === "planilha"){
      insights.push("A planilha ajuda a organizar, mas não avisa a cozinha em tempo real nem mostra o que está atrasando. No Sai aê, cada pedido aparece na cozinha com cronômetro verde, laranja ou vermelho assim que entra.");
    } else if (a.anota === "sistema"){
      insights.push("Sistema de PDV tradicional é feito pra restaurante com mesa fixa e garçom. A fila de feira e a chamada de senha ficam de fora. O Sai aê foi pensado pro seu tipo de negócio, com chamada de senha e um fluxo de cozinha simples.");
    }
    if (a.fila === "asvezes" || a.fila === "sim"){
      insights.push("Fila e demora custam venda: cliente que não entende o processo desiste e vai embora. Com uma tela de chamada de senha, ele sabe exatamente quando o pedido está pronto, sem ficar perguntando no balcão.");
    } else {
      insights.push("Mesmo com o atendimento correndo bem, ter os números organizados — faturamento, ticket médio, o que mais vende — ajuda a manter esse ritmo e decidir com dado, além do feeling.");
    }

    return { faturamentoMensal:faturamentoMensal, potencial:potencial, novoFaturamento:novoFaturamento, insights:insights };
  }

  function buildWhatsAppText(a, diag){
    var linhas = [
      "Oi! Fiz o Raio-X do meu negócio no Sai aê e quero saber mais 🙌",
      "",
      "Nome: " + a.nome,
      "WhatsApp: " + a.whatsapp,
      "Tipo de negócio: " + LABELS.tipo[a.tipo],
      "Pedidos/dia: " + LABELS.pedidos[a.pedidos],
      "Ticket médio: " + LABELS.ticket[a.ticket],
      "Como anota hoje: " + LABELS.anota[a.anota],
      "Confusões por semana: " + LABELS.erros[a.erros],
      "Perde cliente por demora: " + LABELS.fila[a.fila],
      "",
      "Diagnóstico: pode estar deixando cerca de " + fmtBRL(diag.potencial) + "/mês na mesa."
    ];
    return linhas.join("\n");
  }

  function goTo(idx){
    current = idx;
    render();
    window.scrollTo(0,0);
  }
  function goNext(){ if (current < steps.length-1) goTo(current+1); }
  function goBack(){ if (current > 0) goTo(current-1); }

  function selectChoice(fieldId, value){
    answers[fieldId] = value;
    render();
    setTimeout(function(){ goNext(); }, reduceMotion ? 0 : 260);
  }

  function render(){
    var step = steps[current];
    var showTopbar = step.type === "choice" || step.type === "contact";
    topbar.hidden = !showTopbar;
    if (showTopbar){
      var qi = questionIndexOf(current) + 1;
      qcount.textContent = "Pergunta " + qi + " de " + QUESTION_STEPS;
      progressFill.style.width = Math.round((qi-1)/QUESTION_STEPS*100) + "%";
    }

    stage.innerHTML = "";
    var el;
    if (step.type === "welcome") el = renderWelcome();
    else if (step.type === "choice") el = renderChoice(step);
    else if (step.type === "contact") el = renderContact(step);
    else if (step.type === "result") el = renderResult();
    stage.appendChild(el);
  }

  function h(tag, attrs, children){
    var el = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs){
      if (k === "class") el.className = attrs[k];
      else if (k === "html") el.innerHTML = attrs[k];
      else el.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(function(c){ if (c) el.appendChild(c); });
    return el;
  }

  function renderWelcome(){
    var wrap = h("div", {class:"step"});
    wrap.appendChild(h("div", {class:"welcomeMark", html:'<svg viewBox="0 0 196 196" aria-hidden="true"><use href="#icone-cheio"/></svg>'}));
    wrap.appendChild(h("h1", {class:"welcomeTitle", html:"Descubra quanto o seu negócio <em>deixa na mesa</em>"}));
    wrap.appendChild(h("p", {class:"welcomeBody"}, [document.createTextNode("Um teste rápido pra dono de barraca de feira, açaí, lanchonete, quiosque ou barraca de festa. Leva 2 minutos e no final você recebe um diagnóstico grátis do seu negócio.")]));

    var list = h("div", {class:"miniList"});
    var items = [
      ["clock","Menos de 2 minutos, direto no celular"],
      ["bulb","Diagnóstico personalizado pro seu tipo de negócio"],
      ["gift","Planilha grátis e 7 dias do Sai aê liberados no final"]
    ];
    items.forEach(function(it){
      var row = h("div", {class:"miniItem"});
      row.appendChild(h("span", {class:"miniIcon", html:ICONS[it[0]]}));
      row.appendChild(h("span", {}, [document.createTextNode(it[1])]));
      list.appendChild(row);
    });
    wrap.appendChild(list);

    var btn = h("button", {class:"btnPrimary", html:"Começar o Raio-X " + ms("arrow_forward")});
    btn.addEventListener("click", goNext);
    wrap.appendChild(btn);
    wrap.appendChild(h("p", {class:"footNote"}, [document.createTextNode("Sem cadastro chato. Só perguntamos o que a gente precisa pra te mostrar um número de verdade.")]));
    return wrap;
  }

  function renderBack(){
    var row = h("div", {class:"backRow"});
    var btn = h("button", {class:"backBtn", type:"button", html:ms("chevron_left") + "Voltar"});
    btn.addEventListener("click", goBack);
    row.appendChild(btn);
    return row;
  }

  function renderChoice(step){
    var wrap = h("div", {class:"step"});
    wrap.appendChild(renderBack());
    wrap.appendChild(h("h2", {class:"stepTitle"}, [document.createTextNode(step.title)]));

    var grid = h("div", {class:"choiceGrid"});
    step.options.forEach(function(opt){
      var isSel = answers[step.id] === opt.value;
      var chip = h("button", {class:"chip" + (isSel?" is-selected":"")});
      if (opt.icon){
        chip.appendChild(h("span", {class:"chipIcon", html:ICONS[opt.icon]}));
      }
      chip.appendChild(h("span", {class:"chipLabel"}, [document.createTextNode(opt.label)]));
      chip.appendChild(h("span", {class:"chipCheck", html:ICONS.check}));
      chip.addEventListener("click", function(v){ return function(){ selectChoice(step.id, v); }; }(opt.value));
      grid.appendChild(chip);
    });
    wrap.appendChild(grid);
    return wrap;
  }

  function renderContact(step){
    var wrap = h("div", {class:"step"});
    wrap.appendChild(renderBack());
    wrap.appendChild(h("h2", {class:"stepTitle"}, [document.createTextNode("Pra onde a gente manda seu diagnóstico?")]));
    wrap.appendChild(h("p", {class:"stepHint"}, [document.createTextNode("É rapidinho. Usamos só pra te enviar o resultado e liberar seus 7 dias grátis.")]));

    var nomeField = h("div", {class:"field"});
    nomeField.appendChild(h("label", {class:"fieldLabel", for:"inpNome"}, [document.createTextNode("Seu nome")]));
    var nomeInput = h("input", {class:"fieldInput", id:"inpNome", type:"text", placeholder:"Como podemos te chamar?", autocomplete:"name"});
    nomeInput.value = answers.nome || "";
    nomeField.appendChild(nomeInput);
    wrap.appendChild(nomeField);

    var whatsField = h("div", {class:"field"});
    whatsField.appendChild(h("label", {class:"fieldLabel", for:"inpWhats"}, [document.createTextNode("Seu WhatsApp (com DDD)")]));
    var whatsInput = h("input", {class:"fieldInput", id:"inpWhats", type:"tel", inputmode:"tel", placeholder:"(11) 91234-5678", autocomplete:"tel"});
    whatsInput.value = answers.whatsapp || "";
    whatsField.appendChild(whatsInput);
    wrap.appendChild(whatsField);

    var error = h("p", {class:"fieldError", id:"contactError"});
    wrap.appendChild(error);

    var bottom = h("div", {class:"bottomBar"});
    var btn = h("button", {class:"btnPrimary"}, [document.createTextNode("Ver meu diagnóstico grátis")]);
    function submit(){
      var nome = nomeInput.value.trim();
      var whats = whatsInput.value.trim();
      var digits = whats.replace(/\D/g, "");
      if (!nome){
        error.textContent = "Digite seu nome pra gente continuar.";
        nomeInput.focus();
        return;
      }
      if (digits.length < 10){
        error.textContent = "Digite um WhatsApp válido, com DDD.";
        whatsInput.focus();
        return;
      }
      answers.nome = nome;
      answers.whatsapp = whats;
      saveLead();
      goNext();
    }
    btn.addEventListener("click", submit);
    whatsInput.addEventListener("keydown", function(e){ if (e.key === "Enter") submit(); });
    bottom.appendChild(btn);
    bottom.appendChild(h("p", {class:"footNote"}, [document.createTextNode("Ao continuar, você concorda em receber seu diagnóstico e o contato do Sai aê pelo WhatsApp.")]));
    wrap.appendChild(bottom);
    return wrap;
  }

  // Grava o contato na planilha do Google. Nunca trava o teste: se falhar, a pessoa segue normalmente.
  function saveLead(){
    if (!PLANILHA_LEADS_URL) return;
    var diag = computeDiagnosis(answers);
    var q = new URLSearchParams(location.search);
    var payload = {
      token: PLANILHA_LEADS_TOKEN,
      nome: answers.nome, whatsapp: answers.whatsapp,
      tipo: LABELS.tipo[answers.tipo], pedidos: LABELS.pedidos[answers.pedidos], ticket: LABELS.ticket[answers.ticket],
      anota: LABELS.anota[answers.anota], erros: LABELS.erros[answers.erros], fila: LABELS.fila[answers.fila],
      potencial: Math.round(diag.potencial), faturamento: Math.round(diag.faturamentoMensal),
      origem: q.get("utm_source") || document.referrer || "direto",
      campanha: q.get("utm_campaign") || ""
    };
    try {
      fetch(PLANILHA_LEADS_URL, { method:"POST", mode:"no-cors", keepalive:true,
        headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(payload) }).catch(function(){});
    } catch(e){}
  }

  function animateCount(el, target){
    if (reduceMotion){ el.textContent = fmtBRL(target); return; }
    var start = 0;
    var startTime = null;
    var duration = 1100;
    function frame(ts){
      if (startTime === null) startTime = ts;
      var p = Math.min(1, (ts - startTime) / duration);
      var eased = 1 - Math.pow(1-p, 3);
      el.textContent = fmtBRL(start + (target-start)*eased);
      if (p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    // Se a aba estiver em segundo plano a animação pausa: garante o valor final mesmo assim.
    setTimeout(function(){ el.textContent = fmtBRL(target); }, duration + 150);
  }

  function renderResult(){
    var diag = computeDiagnosis(answers);
    var wrap = h("div", {class:"step"});

    var tag = h("span", {class:"resultTag"}); tag.innerHTML = ms("check_circle", true); tag.appendChild(document.createTextNode("Diagnóstico pronto, " + (answers.nome.split(" ")[0] || "")));
    var header = h("div", {class:"resultHeader"});
    header.appendChild(tag);
    header.appendChild(h("h2", {class:"stepTitle"}, [document.createTextNode("Seu negócio pode estar deixando dinheiro na mesa todo mês")]));
    wrap.appendChild(header);

    var hero = h("div", {class:"heroCard"});
    hero.appendChild(h("span", {class:"heroLabel"}, [document.createTextNode("Potencial recuperável por mês")]));
    var heroNum = h("div", {class:"heroNumber"}, [document.createTextNode("R$ 0")]);
    hero.appendChild(heroNum);
    hero.appendChild(h("p", {class:"heroSub"}, [document.createTextNode("Estimativa com base em pedidos perdidos, erros e clientes que desistem na fila.")]));
    wrap.appendChild(hero);
    setTimeout(function(){ animateCount(heroNum, diag.potencial); }, 120);

    var statRow = h("div", {class:"statRow"});
    var s1 = h("div", {class:"statCard"});
    s1.appendChild(h("span", {class:"statLabel"}, [document.createTextNode("Faturamento hoje (estimado)")]));
    s1.appendChild(h("span", {class:"statValue"}, [document.createTextNode(fmtBRL(diag.faturamentoMensal) + "/mês")]));
    var s2 = h("div", {class:"statCard"});
    s2.appendChild(h("span", {class:"statLabel"}, [document.createTextNode("Com esse potencial recuperado")]));
    s2.appendChild(h("span", {class:"statValue up"}, [document.createTextNode(fmtBRL(diag.novoFaturamento) + "/mês")]));
    statRow.appendChild(s1); statRow.appendChild(s2);
    wrap.appendChild(statRow);

    var insightList = h("div", {class:"insightList"});
    diag.insights.forEach(function(text){
      var card = h("div", {class:"insightCard"});
      card.appendChild(h("span", {class:"insightIcon", html:ICONS.bulb}));
      card.appendChild(h("span", {class:"insightText"}, [document.createTextNode(text)]));
      insightList.appendChild(card);
    });
    wrap.appendChild(insightList);

    var done = h("div", {class:"ctaCard"});
    done.appendChild(h("span", {class:"doneTag", html: ms("task_alt", true) + "Teste concluído"}));
    done.appendChild(h("p", {class:"ctaTitle"}, [document.createTextNode("Pronto, " + (answers.nome.split(" ")[0] || "tudo certo") + "! Sua planilha grátis está liberada.")]));
    done.appendChild(h("p", {class:"ctaBody"}, [document.createTextNode("Baixe a planilha e crie sua conta para usar o Sai aê por 7 dias grátis.")]));
    var soonNote = h("p", {class:"soonNote", hidden:"hidden", role:"status"});
    function soonMsg(what){ soonNote.textContent = what + " chega em breve. Enquanto isso, fale com a gente no WhatsApp."; soonNote.hidden = false; }
    var dl = h("a", {class:"btnDark", href: PLANILHA_URL || "#", html: ms("download") + "Baixar planilha grátis"});
    if (PLANILHA_URL) dl.setAttribute("download", "Controle de Vendas - Sai aê.xlsx"); else dl.addEventListener("click", function(e){ e.preventDefault(); soonMsg("A planilha"); });
    var cad = h("a", {class:"btnOut", href: CADASTRO_URL || "#", html: "Criar minha conta grátis " + ms("arrow_forward")});
    if (!CADASTRO_URL) cad.addEventListener("click", function(e){ e.preventDefault(); soonMsg("O cadastro no aplicativo"); });
    done.appendChild(dl); done.appendChild(cad); done.appendChild(soonNote);
    wrap.appendChild(done);

    var cta = h("div", {class:"waCard"});
    cta.appendChild(h("p", {class:"waTitle"}, [document.createTextNode("Prefere falar com a gente? Mande seu diagnóstico no WhatsApp.")]));
    var waBtn = h("button", {class:"btnWhats"}, [ (function(){var s=document.createElement("span"); s.innerHTML=ICONS.whats; return s;})(), document.createTextNode("Enviar no WhatsApp")]);
    var sentNote = h("p", {class:"sentNote", hidden:"hidden"}, [document.createTextNode("Se o WhatsApp abriu, é só apertar enviar.")]);
    waBtn.addEventListener("click", function(){
      var text = buildWhatsAppText(answers, diag);
      var url = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(text);
      var a = document.createElement("a");
      a.href = url; a.target = "_blank"; a.rel = "noopener";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      sentNote.hidden = false;
    });
    cta.appendChild(waBtn);
    cta.appendChild(sentNote);
    wrap.appendChild(cta);

    var copyBtn = h("button", {class:"copyLink"}, [document.createTextNode("Prefere copiar o diagnóstico em vez de abrir o WhatsApp?")]);
    copyBtn.addEventListener("click", function(){
      var text = buildWhatsAppText(answers, diag);
      function fallback(){
        var ta = document.createElement("textarea");
        ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
        document.body.appendChild(ta); ta.focus(); ta.select();
        try { document.execCommand("copy"); } catch(e){}
        document.body.removeChild(ta);
        copyBtn.textContent = "Copiado! Cole onde preferir.";
      }
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){
          copyBtn.textContent = "Copiado! Cole onde preferir.";
        }).catch(fallback);
      } else { fallback(); }
    });
    wrap.appendChild(copyBtn);

    wrap.appendChild(h("p", {class:"footNote"}, [document.createTextNode("Esses números são uma estimativa com base no que você respondeu. O valor real você só vê de verdade usando o Sai aê no dia a dia.")]));

    var restart = h("button", {class:"restartLink"}, [document.createTextNode("Refazer o teste")]);
    restart.addEventListener("click", function(){
      answers = { tipo:null, pedidos:null, ticket:null, anota:null, erros:null, fila:null, nome:"", whatsapp:"" };
      goTo(0);
    });
    wrap.appendChild(restart);

    return wrap;
  }

  render();
})();
</script>
</body>
</html>
